cmd_vel_mux_node:
  ros__parameters:
    joy_input_topic: "/cmd_vel_joy"
    remote_input_topic: "/cmd_vel_remote"
    output_topic: "/cmd_vel"
    active_source: "remote"
    source_timeout_sec: 0.5
    timeout_mode: "brake"      # brake | fallback
    fallback_source: "joy"     # timeout_mode=fallback 时生效
    lock_active_source: false
