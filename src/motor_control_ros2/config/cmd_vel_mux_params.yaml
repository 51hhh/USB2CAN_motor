cmd_vel_mux_node:
  ros__parameters:
    joy_input_topic: "/cmd_vel_joy"
    remote_input_topic: "/cmd_vel_remote"
    output_topic: "/cmd_vel"
    active_source: "remote"       # 优先 vision/remote 控制
    source_timeout_sec: 0.5
    timeout_mode: "brake"         # 超时只刹停，不自动改 active_source
    fallback_source: "joy"        # 仅在 timeout_mode=fallback 时生效
    lock_active_source: false
    joy_raw_topic: "/joy"
    switch_to_remote_button: 5    # RB 键：切到 vision/remote 模式
    switch_to_joy_button: 4       # LB 键：切回手柄模式
