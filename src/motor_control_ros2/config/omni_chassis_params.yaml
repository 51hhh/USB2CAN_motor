omni_chassis_control_node:
  ros__parameters:
    control_frequency: 100.0
    cmd_vel_topic: "/cmd_vel"
    cmd_pose_topic: "/cmd_pose"
    odom_topic: "/odom"
    estop_topic: "/chassis/estop"
    default_mode: "velocity"
    # open_loop: 遥控速度直接做逆运动学输出轮速，暂不依赖 /odom.twist。
    # closed_loop: 使用 /odom.twist 和 velocity_pid_* 做速度闭环。
    velocity_control_mode: "open_loop"

    wheel_base_x: 0.88
    wheel_base_y: 0.88
    wheel_radius: 0.1062
    install_angle: 45.0

    max_linear_velocity: 2.0
    max_angular_velocity: 2.0
    cmd_timeout: 0.5
    zero_target_deadband: 0.001
    position_timeout: 1.0
    goal_tolerance_xy: 0.02
    goal_tolerance_yaw: 0.05

    fl_motor: "DJI3508_1"
    fr_motor: "DJI3508_2"
    rl_motor: "DJI3508_3"
    rr_motor: "DJI3508_4"

    fl_drive_direction: 1
    fr_drive_direction: 1
    rl_drive_direction: 1
    rr_drive_direction: 1

    velocity_pid_x:
      kp: 2.0
      ki: 0.2
      kd: 0.0
      i_max: 1.0
      out_max: 2.0
      dead_zone: 0.0

    velocity_pid_y:
      kp: 2.0
      ki: 0.2
      kd: 0.0
      i_max: 1.0
      out_max: 2.0
      dead_zone: 0.0

    velocity_pid_yaw:
      kp: 2.5
      ki: 0.1
      kd: 0.0
      i_max: 1.0
      out_max: 2.0
      dead_zone: 0.0

    position_pid_x:
      kp: 1.2
      ki: 0.0
      kd: 0.0
      i_max: 0.0
      out_max: 1.0
      dead_zone: 0.005

    position_pid_y:
      kp: 1.2
      ki: 0.0
      kd: 0.0
      i_max: 0.0
      out_max: 1.0
      dead_zone: 0.005

    position_pid_yaw:
      kp: 2.0
      ki: 0.0
      kd: 0.0
      i_max: 0.0
      out_max: 1.5
      dead_zone: 0.01
