chassis_control_node:
  ros__parameters:
    # 控制频率
    control_frequency: 100.0  # Hz

    # 底盘速度输入 topic（通常接 cmd_vel_mux_node 的 output_topic）
    cmd_vel_topic: "/cmd_vel"
    limited_cmd_topic: "/chassis/limited_cmd"
    estop_topic: "/emergency_stop"
    motor_state_topic: "/dji_motor_states"
    motor_command_topic: "/dji_motor_command_advanced"
    chassis_state_topic: "/chassis_state"
    base_frame: "base_link"
    
    # 底盘几何参数（根据用户提供的参数）
    wheel_base_x: 0.65    # 前后轮距 (m) - 650mm
    wheel_base_y: 0.62    # 左右轴距 (m) - 620mm
    wheel_radius: 0.055   # 轮子半径 (m) - 55mm
    
    # 速度限制
    # 与 remote_control_params.yaml 保持一致，避免上游百分比缩放失真后，
    # chassis_control_node 仍继续接受不现实的超大线速度命令。
    max_linear_velocity: 2.7     # 最大线速度 (m/s)
    max_angular_velocity: 6.0    # 最大角速度 (rad/s)
    max_vx_m_s: 2.7              # G0 前仅为候选值，实车测试前必须复核
    max_vy_m_s: 2.7
    max_wz_rad_s: 6.0
    max_wheel_speed_m_s: 2.7

    # 命令与舵角安全限制（候选值；G0 后冻结实测值）
    max_ax_m_s2: 1.5
    max_ay_m_s2: 1.5
    max_awz_rad_s2: 3.0
    max_steer_rate_deg_s: 180.0
    steer_alignment_stop_deg: 60.0
    cosine_compensation: true

    # 三层失效保护：命令、电机反馈和急停心跳任一超时均立即零驱动
    command_watchdog_s: 0.20
    motor_state_watchdog_s: 0.20
    estop_watchdog_s: 0.20
    require_estop_heartbeat: true
    velocity_deadband_m_s: 0.01
    angular_deadband_rad_s: 0.01
    fault_temperature_c: 80
    fault_current_abs: 15000
    
    # 电机映射（对应 motors.yaml 中的名称）
    # 左前舵轮单元
    fl_steer_motor: "DJI6020_1"  # 左前转向
    fl_drive_motor: "DJI3508_1"  # 左前驱动
    fl_steer_offset: 330.8       # 转向零位偏移（度），正前方时的编码器角度
    fl_steer_direction: -1        # 舵轮方向：1=正向，-1=反向
    fl_drive_direction: 1        # 驱动方向：1=正转向前，-1=正转向后
    
    # 右前舵轮单元
    fr_steer_motor: "DJI6020_2"  # 右前转向
    fr_drive_motor: "DJI3508_2"  # 右前驱动
    fr_steer_offset: 89.6         # 转向零位偏移（度）
    fr_steer_direction: -1        # 舵轮方向：1=正向，-1=反向
    fr_drive_direction: -1       # 驱动方向：对称安装，正转向后
    
    # 左后舵轮单元
    rl_steer_motor: "DJI6020_3"  # 左后转向
    rl_drive_motor: "DJI3508_3"  # 左后驱动
    rl_steer_offset: 207.1         # 转向零位偏移（度）
    rl_steer_direction: -1        # 舵轮方向：1=正向，-1=反向
    rl_drive_direction: 1        # 驱动方向：正转向前
    
    # 右后舵轮单元
    rr_steer_motor: "DJI6020_4"  # 右后转向
    rr_drive_motor: "DJI3508_4"  # 右后驱动
    rr_steer_offset: 33.0         # 转向零位偏移（度）
    rr_steer_direction: -1        # 舵轮方向：1=正向，-1=反向
    rr_drive_direction: -1       # 驱动方向：对称安装，正转向后
