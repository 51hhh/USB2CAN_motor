# 排球向上击球系统参数配置
# 硬件规格：左右对称 2DOF 串联臂 + 刚性排球拍 → 平面冗余驱动闭链
# 传动方式：14-200-14-200 精确平行四边形 → q_motor = θ_relative（直通）
#
# ╔═══════════════════════════════════════════════════════════════╗
# ║  GO-M8010-6 MIT 模式协议缩放（减速比 i=6.33，所有值必读）    ║
# ║                                                               ║
# ║  cmd.kp  = 期望输出轴刚度(Nm/rad)   / (6.33×6.33) = / 40.07  ║
# ║  cmd.kd  = 期望输出轴阻尼(Nm·s/rad) / (6.33×6.33) = / 40.07  ║
# ║  cmd.tau = 期望输出轴力矩(Nm)       / 6.33                   ║
# ║                                                               ║
# ║  例: Kp=10 Nm/rad → config = 10/40.07  ≈ 0.250               ║
# ║      τ=3 Nm       → config = 3/6.33    ≈ 0.474               ║
# ║      Kd=5 Nm·s/rad→ config = 5/40.07   ≈ 0.125               ║
# ╚═══════════════════════════════════════════════════════════════╝

# 几何参数（以米为单位）
geometry:
  arm_spacing: 0.3506          # D: 左右肩关节间距 = 350.6mm
  upper_arm_length: 0.200      # L1: 大臂长度（肩→肘）= 200mm
  forearm_length: 0.224        # L2: 小臂前端（肘→拍面铰接点）= 224mm
  plate_width: 0.3506          # W: 拍面两侧铰接点间距 = D = 350.6mm
  crank_length: 0.014          # 主动拨片/从动摇臂长度 = 14mm（仅文档参考）

# IK 求解器参数
ik_solver:
  elbow_sign_left: 1           # 左臂肘构型 (+1=elbow-up)
  elbow_sign_right: 1          # 【修复】右臂数学上也必须是 1！物理镜像已由 motor_direction=-1 处理
  symmetric_mode: true         # 强制 L1=R1, L2=R2 镜像指令（消除闭链内力）

# 电机映射（对应 motors.yaml 中的电机名称）
motors:
  - name: arm_motor_l_1        # 左大臂电机（直驱）
    device: /dev/ttyUSB0
    id: 0
    direction: -1              # 实测：电机正转=臂后摆，需反向
  - name: arm_motor_l_2        # 左小臂电机（平行四边形传动）
    device: /dev/ttyUSB0
    id: 1
    direction: -1              # 同侧与L1一致
  - name: arm_motor_r_1        # 右大臂电机（直驱）
    device: /dev/ttyUSB1
    id: 2
    direction: 1               # 右侧镜像，L1取反
  - name: arm_motor_r_2        # 右小臂电机（平行四边形传动）
    device: /dev/ttyUSB1
    id: 3
    direction: 1               # 同侧与R1一致

# 标定参数
calibration:
  zero_offsets: [0.0, 0.0, 0.0, 0.0]  # [L1, L2, R1, R2] 零位偏移 (rad)
  homing_ik_offsets: [-1.571, 1.222, -1.571, 1.222]  # [L1, L2, R1, R2] IK数学零点与物理限位零点的偏差 (rad)

# 开机归零（单圈绝对编码器）
# 顺序：先小臂(L2/R2)撞限位设最小=0，再大臂(L1/R1)向下撞限位设最小=0
homing:
  enabled: true
  kd: 0.100                    # 撞限位阶段阻尼         → 物理 4.0 Nm·s/rad (÷40.07) 适中阻尼限速
  hold_kp: 0.525               # 非当前归零轴保持刚度   → 物理 9.0 Nm/rad   (÷40.07)
  hold_kd: 0.202               # 非当前归零轴保持阻尼   → 物理 1.3 Nm·s/rad (÷40.07)
  velocity_threshold: 0.12     # |ω|<该值可判定为"触底/触限位" (rad/s)
  stable_duration_s: 0.40      # 触限位后稳定持续时间 (s)
  min_travel_rad: 0.00        # 单阶段最小位移，避免"未运动就判稳" (rad)
  timeout_s: 8.0               # 单阶段超时保护 (s)
  torque_to_min: [-1.2, 1.20, -1.2, 1.2]
                               # home 撞限位力矩 [L1,L2,R1,R2]  全部方向已修正 (÷6.33)
  idle_hold_torque: [0.3, 0.253, 0.3, 0.253]
                               # 恒定前馈托举 [L1,L2,R1,R2]
                               # 肩关节=0: home位重力矩≈0.5Nm, Kp=40Nm/rad的0.7°偏差即可补偿

# 控制频率
control_frequency: 200.0       # Hz

# 阻抗参数（MIT 模式：τ = Kp·(p_des-p_act) + Kd·(v_des-v_act) + τ_ff）
impedance:
  # STRIKE（从 Home 直冲虚拟穿透目标）：高刚度最大加速
  strike:
    kp_shoulder: 0.998         # → 物理 40 Nm/rad    (÷40.07)
    kp_elbow: 0.499            # → 物理 20 Nm/rad    (÷40.07)
    kd_shoulder: 0.050         # → 物理  2 Nm·s/rad  (÷40.07) 低阻尼，不抑制加速
    kd_elbow: 0.025            # → 物理  1 Nm·s/rad  (÷40.07)
    tau_ff_scale: 0.02         # 惯性前馈 ≈ 有效转动惯量 (kg·m²)，代码内自动 ÷6.33

  # IMPACT_MOMENT（击球窗口 ±25ms）：极低 Kp 纯力矩爆破
  impact:
    kp_shoulder: 0.050         # → 物理  2 Nm/rad    (÷40.07) 极低→不对抗球反冲
    kp_elbow: 0.025            # → 物理  1 Nm/rad    (÷40.07)
    kd_shoulder: 0.012         # → 物理 0.5 Nm·s/rad (÷40.07) 极低→不拖慢击打
    kd_elbow: 0.006            # → 物理 0.25 Nm·s/rad(÷40.07)
    tau_ff_shoulder: 1.264     # → 物理  8 Nm       (÷6.33) 大臂主击打力矩
    tau_ff_elbow: 0.632        # → 物理  4 Nm       (÷6.33) 小臂辅助力矩
    window_after_ms: 20        # 击球后超时保护 (ms)  —— 延长击球窗口

  # FOLLOW_THROUGH（随挥刹车）：Kd 线性 ramp
  follow_through:
    kp_shoulder: 0.080         # → 物理 10 Nm/rad    (÷40.07)
    kp_elbow: 0.040           # → 物理  5 Nm/rad    (÷40.07)
    kd_start: 0.012            # → 物理 0.5 Nm·s/rad (÷40.07) 初始低→避免力矩冲击
    kd_end_shoulder: 0.250    # → 物理  8 Nm·s/rad  (÷40.07) 最终高→强力耗散
    kd_end_elbow: 0.150        # → 物理  5 Nm·s/rad  (÷40.07)
    ramp_duration_ms: 80      # Kd 爬升时间 (ms)

  # SETTLING（缓冲回位）：复用 STRIKE 阻抗参数，低速回 home
  settling:
    max_velocity: 10.0        # 回位最大角速度 (rad/s) —— 明显降低，慢速下落
    max_acceleration: 15.0      # 回位最大角加速度 (rad/s²) —— 抑制突然下坠
    reach_tol: 0.03            # 到位容差 (rad) 约 1.7°

# 轨迹规划参数
trajectory:
  max_joint_velocity: 30.0     # 最大关节角速度 (rad/s) —— 提速
  max_joint_acceleration: 120.0 # 最大关节角加速度 (rad/s²) —— 提速

# 空间事件触发参数（替代视觉时间驱动）
spatial_trigger:
  impact_y_threshold: 0.02     # FK y 距击球点切换阈值 (m)  —— 更接近目标触发
  impact_overshoot_exit: 0.10  # IMPACT 超越击球点退出距离 (m)
  virtual_overshoot_y: 0.10    # 虚拟穿透目标 y 正向偏移 (m)


# 安全参数
safety:
  max_position_error: 0.50      # 位置误差钳位 (rad) — 安全网防暴走，正常靠轨迹规划器保证平滑
  velocity_spike_threshold: 20.0  # 速度突变触发 E_STOP 阈值 (rad/s)
  torque_limit: 1.58           # 力矩限幅             → 物理 10 Nm     (÷6.33)
  

# 工作空间限制（相对于基座中心，米）
workspace:
  x_min: 0.10
  x_max: 0.40
  y_min: -0.25
  y_max: 0.25
