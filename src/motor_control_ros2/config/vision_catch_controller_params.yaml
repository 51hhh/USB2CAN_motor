vision_catch_controller_node:
  ros__parameters:
    goal_topic: "/ball/landing"
    odom_topic: "/odom"
    cmd_vel_topic: "/cmd_vel_remote"
    goal_frame: "vision_world"
    control_frequency: 100.0
    approach_gain: 1.0  #比例
    max_linear_speed: 4.0  #最大线速度
    speed_profile_enabled: true  # true: 使用刹停距离速度规划; false: 使用旧 P 控速
    accel_limit: 3.0  #启动加速度限制(m/s^2)
    decel_limit: 4.0  #刹车减速度限制(m/s^2)
    position_tolerance: 0.05  #位置容差
    goal_timeout_sec: 1.0  #目标超时
    odom_timeout_sec: 0.5  #里程计超时
    yaw_hold_enabled: true      # 是否启用车头 yaw 控制
    use_goal_yaw: false          # PointStamped 不含 orientation，yaw 由 odom 当前值初始化
    rotate_after_position_reached: true  # 到达目标点后是否继续原地对齐 yaw
    yaw_kp: 1.5                 # yaw 保持 P 增益
    max_angular_speed: 0.1      # yaw 修正角速度上限(rad/s)，还会被底盘 max_angular_velocity 再限幅
    yaw_cmd_sign: -1.0          # yaw 闭环输出方向；若 angular.z 正方向与 /odom yaw 正方向一致则设为 1.0
    yaw_tolerance_rad: 0.03     # yaw 误差死区(rad)
