tri_swerve_chassis_node:
  ros__parameters:
    # ──────────────────────────────────────────────────────────────────
    # 底盘几何参数
    # ──────────────────────────────────────────────────────────────────
    # circumradius: 底盘中心到各舵轮安装轴的距离 (m)
    # 等边三角形三舵轮，三个轮子等距排布在该圆周上
    circumradius: 0.25

    # wheel_radius: 驱动轮橡胶滚动半径 (m)
    wheel_radius: 0.15

    # drive_gear_ratio: 驱动电机减速比（GM3508 = 19:1）
    drive_gear_ratio: 19.0

    # ──────────────────────────────────────────────────────────────────
    # 控制参数
    # ──────────────────────────────────────────────────────────────────
    control_frequency: 100.0     # 控制循环频率 (Hz)
    max_linear_velocity: 2.9     # 3500RPM→2.89m/s
    max_angular_velocity: 4.0    # 最大旋转角速度 (rad/s)

    # cmd_vel 输入话题（joystick_control_node 默认输出 /cmd_vel_joy）
    cmd_vel_topic: "/cmd_vel_joy"

    # ──────────────────────────────────────────────────────────────────
    # 轮子电机映射（与 motors.yaml 中的 joint_name 对应）
    # 布局（ROS 坐标：X 向前，Y 向左）：
    #
    #        F (前)
    #       /  \
    #      BL--BR (后左/后右)
    #
    # 转向电机：GM6020 | 驱动电机：GM3508
    # ──────────────────────────────────────────────────────────────────

    # ── 前轮 (F) ──────────────────────────────────────────────────────
    f_steer_motor: "DJI6020_1"
    f_drive_motor: "DJI3508_1"
    f_steer_offset: 0.0
    f_steer_direction: 1
    f_drive_direction: 1

    # ── 后左轮 (BL) ───────────────────────────────────────────────────
    bl_steer_motor: "DJI6020_2"
    bl_drive_motor: "DJI3508_2"
    bl_steer_offset: 0.0
    bl_steer_direction: 1
    bl_drive_direction: 1

    # ── 后右轮 (BR) ───────────────────────────────────────────────────
    br_steer_motor: "DJI6020_4"
    br_drive_motor: "DJI3508_4"
    br_steer_offset: 0.0
    br_steer_direction: 1
    br_drive_direction: 1
