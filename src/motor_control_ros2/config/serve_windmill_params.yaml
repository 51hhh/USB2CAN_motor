serve_windmill_manager:
  ros__parameters:
    motors:
      master_name: "DJI3508_1"
      encoder_name: "DJI3508_2"
      direction: -1              # 输出方向乘子 (+1 或 -1)，同时翻转反馈与输出

    angles_deg:
      wind_up: 190.0
      fire_end: 70.0
      catch_start: 270.0
      catch_target: 360.0

    current_limits:
      fire: 10000
      wind_up_max: 8000
      catch_max: 8000
      global_max: 14000

    gains:
      wind_up:
        kp: 100.0
        kd: 3.0
      catch:
        kp: 60.0
        kd: 4.0
      gravity_ff_current: 0    # 重力前馈电流 (实测: kp=0,kd=0时能托住臂的电流值, 通常1500~3000)

    homing:
      vel_threshold_rpm: 8.0
      stable_duration_s: 1.0

    free_wheel:
      vel_threshold_rpm: 20.0

    safety:
      runaway_threshold_deg: 1080.0  # 任何状态下最大允许角位移 (3圈)

    control:
      frequency: 200.0
      position_tolerance_deg: 3.0
