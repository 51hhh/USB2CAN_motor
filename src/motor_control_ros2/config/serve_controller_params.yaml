serve_controller_node:
  ros__parameters:
    # ── 手柄按钮映射（Xbox 标准：A=0, B=1, X=2, Y=3, LB=4, RB=5）──────
    button_trigger: 4         # LB：启动完整发球序列
    button_abort:   5         # RB：立即停止并回零

    # ── Delta 机械臂（垫球盘）─────────────────────────────────────────
    arm_descend_rad:    -0.8  # 垫球盘下降增量（弧度，负=向下）
    arm_wait_timeout:    5.0  # 等待 /delta_arm/ready 超时（秒）

    # ── DJI 3508 发球电机 ─────────────────────────────────────────────
    motor1_name:  "DJI3508_1" # 主电机名称（与 motor_control_node 配置一致）
    motor2_name:  "DJI3508_2" # 副电机名称（对称安装，指令自动取反）
    use_motor2:   true        # 是否启用副电机

    charge_angle_deg:      240.0   # 蓄力目标角度（度，顺时针）
    charge_speed_rpm:     1000.0   # 蓄力旋转速度（RPM）
    charge_threshold_deg:    5.0   # 蓄力到位判定阈值（度）

    strike_current:       -16384   # 击球电流（负值=逆时针，范围 -16384~16384）
    strike_rotation_deg:   450.0   # 击球累积转角（度，1.25 圈）
    strike_timeout_s:        2.0   # 击球阶段超时保护（秒）

    return_speed_rpm:     1500.0   # 回零速度（RPM）
    return_threshold_deg:    5.0   # 回零到位判定阈值（度）

    # ── 关键时序参数 ──────────────────────────────────────────────────
    # 垫球完成（delta_arm/ready）→ 发球击打之间的等待时间（秒）
    # 这是影响发球质量的核心参数：
    #   过短 → 球还没稳定在垫球盘上就击打
    #   过长 → 球弹走后才击打
    # 建议范围：0.1 ~ 0.6 s，根据实际测试调整
    delay_arm_to_strike_s:   0.30

    # ── 控制频率 ──────────────────────────────────────────────────────
    control_hz:  200.0
